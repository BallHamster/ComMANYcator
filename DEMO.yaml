# Board: ESP32-C6 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-c6-devkitc-1/manifest.yaml

esphome:
  name: commanycator
  friendly_name: ComMANYcator

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "YOURKEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP Fallback Hotspot
    password: "YOURPASS"

captive_portal:
  
globals:
  - id: learn_rf_next
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: saved_rf_raw
    type: std::string
    restore_value: yes
    max_restore_data_length: 254
    initial_value: '""'
  - id: learn_ir_next
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: saved_ir_raw
    type: std::string
    restore_value: yes
    max_restore_data_length: 254
    initial_value: '""'
spi:
  clk_pin: GPIO11
  mosi_pin: GPIO2
  miso_pin: GPIO3

remote_transmitter:
  - id: ir_transmitter
    pin: GPIO10
    carrier_duty_percent: 50%
    
  - id: rf_transmitter_433
    pin:
      number: GPIO21
      allow_other_uses: true
    carrier_duty_percent: 100%
    on_transmit:
      then:
        - cc1101.begin_tx: rf_433
    on_complete:
      then:
        - cc1101.begin_rx: rf_433

  - id: rf_transmitter_868
    pin:
      number: GPIO19
      allow_other_uses: true
    carrier_duty_percent: 100%
    on_transmit:
      then:
        - cc1101.begin_tx: rf_868
    on_complete:
      then:
        - cc1101.begin_rx: rf_868

remote_receiver:
  - id: ir_reciever_38khz
    pin: 
      number: GPIO6
      inverted: true
    dump: all
    idle: 25ms
    tolerance: 25%
    on_raw:
      then:
        - if:
            condition:
              lambda: 'return id(learn_ir_next);'
            then:
              - lambda: |-
                  std::string encoded;
                  for (size_t i = 0; i < x.size(); i++) {
                    if (i > 0) encoded += ",";
                    encoded += std::to_string(x[i]);
                  }

                  if (!encoded.empty() && encoded.size() <= 254) {
                    id(saved_ir_raw) = encoded;
                    ESP_LOGI("ir_learn", "IR signal saved: %u impulse",
                             (unsigned) x.size());
                  } else {
                    ESP_LOGW("ir_learn",
                             "Signal is empty, or too big.");
                  }

                  id(learn_ir_next) = false;
  - id: rf_receiver_433
    pin:
      number: GPIO21
      allow_other_uses: true
    dump: all
    on_raw:
      then:
        - if:
            condition:
              lambda: 'return id(learn_rf_next);'
            then:
              - lambda: |-
                  std::string encoded;
                  for (size_t i = 0; i < x.size(); i++) {
                    if (i > 0) encoded += ",";
                    encoded += std::to_string(x[i]);
                  }

                  if (!encoded.empty() && encoded.size() <= 254) {
                    id(saved_rf_raw) = encoded;
                    ESP_LOGI("rf_learn", "RF signal saved: %u impulse",
                             (unsigned) x.size());
                  } else {
                    ESP_LOGW("rf_learn", "The signal is empty, or too big..");
                  }

                  id(learn_rf_next) = false;

  - id: rf_receiver_868
    pin:
      number: GPIO19
      allow_other_uses: true
    dump: all
    on_raw:
      then:
        - if:
            condition:
              lambda: 'return id(learn_rf_next);'
            then:
              - lambda: |-
                  std::string encoded;
                  for (size_t i = 0; i < x.size(); i++) {
                    if (i > 0) encoded += ",";
                    encoded += std::to_string(x[i]);
                  }

                  if (!encoded.empty() && encoded.size() <= 254) {
                    id(saved_rf_raw) = encoded;
                    ESP_LOGI("rf_learn", "RF signal saved: %u impulse",
                             (unsigned) x.size());
                  } else {
                    ESP_LOGW("rf_learn", "The signal is empty, or too big..");
                  }

                  id(learn_rf_next) = false;

cc1101:
  - id: rf_433
    cs_pin: GPIO23
    frequency: 433.92MHz
    modulation_type: ASK/OOK
    gdo0_pin:
      number: GPIO21
      allow_other_uses: true
      
  - id: rf_868
    cs_pin: GPIO18
    frequency: 868.3MHz
    modulation_type: ASK/OOK
    gdo0_pin:
      number: GPIO19
      allow_other_uses: true

button:
  - platform: template
    name: "ComMANYcator IR test"
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: ir_transmitter
          code: [9000, -4500, 560, -560, 560, -1690, 560, -560, 560, -560]
          carrier_frequency: 38kHz

  - platform: template
    name: "ComMANYcator RF 433 test"
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter_433
          code: [500, -500, 1000, -500, 500, -1000, 500, -500]
          repeat:
            times: 3
            wait_time: 10ms
  - platform: template
    name: "ComMANYcator RF 868 test"
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter_868
          code: [500, -500, 1000, -500, 500, -1000, 500, -500]
          repeat:
            times: 3
            wait_time: 10ms
  - platform: template
    name: "IR - learn next signal"
    on_press:
      - lambda: |-
          id(learn_ir_next) = true;
          ESP_LOGI("ir_learn", "Press a button.");
  - platform: template
    name: "RF - learn next signal"
    on_press:
      - lambda: |-
          id(learn_rf_next) = true;
          ESP_LOGI("rf_learn", "Press a button.");

  - platform: template
    name: "IR - send saved signal"
    on_press:
      - if:
          condition:
            lambda: 'return !id(saved_ir_raw).empty();'
          then:
            - remote_transmitter.transmit_raw:
                transmitter_id: ir_transmitter
                carrier_frequency: 38kHz
                code: !lambda |-
                  std::vector<int32_t> result;
                  std::string s = id(saved_ir_raw);
                  size_t start = 0;
                  while (start < s.size()) {
                    size_t end = s.find(',', start);
                    if (end == std::string::npos) end = s.size();
                    result.push_back(
                      (int32_t) strtol(s.substr(start, end - start).c_str(),
                                       nullptr, 10));
                    start = end + 1;
                  }
                  return result;
          else:
            - logger.log: "No saved IR signal."
  - platform: template
    name: "RF - send learned signal"
    on_press:
      - if:
          condition:
            lambda: 'return !id(saved_rf_raw).empty();'
          then:
            - remote_transmitter.transmit_raw:
                transmitter_id: rf_transmitter_433
                code: !lambda |-
                  std::vector<int32_t> result;
                  std::string s = id(saved_rf_raw);
                  size_t start = 0;

                  while (start < s.size()) {
                    size_t end = s.find(',', start);
                    if (end == std::string::npos) {
                      end = s.size();
                    }

                    result.push_back(
                      (int32_t) strtol(
                        s.substr(start, end - start).c_str(),
                        nullptr, 10
                      )
                    );

                    start = end + 1;
                  }
                
            
                  return result;
                repeat:
                  times: 3
                  wait_time: 10ms
          else:
            - logger.log: "No saved RF signal."
